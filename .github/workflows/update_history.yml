name: Update Historical Stock Data

on:
  schedule:
    # 15:30 giờ Việt Nam = 08:30 UTC
    - cron: "30 8 * * 1-5"

  # Cho phép chạy thủ công để test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải source code và database hiện tại
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Cài Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Cài các thư viện cần cho pipeline lịch sử
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas vnstock==4.0.8

      # 4. Chạy cập nhật dữ liệu lịch sử
      - name: Update historical data
        run: |
          python -m stock_bot.data_pipeline.update_history

      # 5. Kiểm tra database
      - name: Check database
        run: |
          ls -lh data/market_data.db

      # 6. Commit database mới
      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_data.db

          if [ -f data/history_failed_symbols.csv ]; then
            git add data/history_failed_symbols.csv
          fi

          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới để commit."
          else
            git commit -m "Update historical stock data"
            git push
          fi